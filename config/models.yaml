models:
  # ============================================================================
  # Multicluster Configuration Example
  # ============================================================================
  # Supports intelligent routing across multiple LLM clusters with dynamic
  # capacity management based on latency stress signals.
  #
  # Cluster Fields:
  #   - cluster_id: Unique identifier for the cluster
  #   - base_url: Base URL for the LLM API endpoint
  #   - api_key: API key (optional, can use env var substitution)
  #   - number_of_replicas: Number of pods in the cluster (for capacity calculation)
  #   - is_enabled: Whether this cluster is active and can receive traffic
  #   - auto_adapt_capacity: Whether to automatically adjust capacity based on latency
  #   - priority: Routing priority (0=highest, higher numbers = lower priority)
  #
  # Routing Fields:
  #   - spill_ratio: Threshold for spilling to remote clusters (0.0-1.0)
  #   - seed_capacity_tokens_per_pod: Initial capacity per pod in tokens
  #   - default_max_tokens: Fallback when request omits max_tokens
  #   - cache_ttl_seconds: How long to remember cluster → context mapping
  #   - ttft_budget_ms: TTFT above this indicates cluster stress
  #   - itl_budget_ms: Mean ITL above this indicates cluster stress
  #   - ttft_alpha: EWMA factor for TTFT (slow - queue changes gradually)
  #   - itl_alpha: EWMA factor for ITL (faster - decode saturates quickly)
  #   - capacity_alpha: Capacity adaptation rate
  # ============================================================================
  - model_id: moonshotai/Kimi-K2.5-v3
    type: multi_cluster
    clusters:
      - cluster_id: pxw-dev-gpu
        base_url: https://kimik2.ai.dev.paycomhq.com/v1
        api_key: ""
        number_of_replicas: 5 # Pod count for capacity calc: 5 × 40000 = 200k total
        is_enabled: true # Enable/disable cluster via API/UI
        auto_adapt_capacity: false # Auto-adapt capacity based on latency
        priority: 0 # Highest priority (local cluster)
      - cluster_id: pxw-reg-gpu
        base_url: https://kimik2.ai.dev.paycomhq.com/v1
        api_key: ""
        number_of_replicas: 3
        is_enabled: true
        auto_adapt_capacity: false
        priority: 1 # Lower priority (remote cluster)
    routing:
      # local_cluster_id: pxw-dev-gpu   # Override ROUTER_CLUSTER_ID for this model
      spill_ratio: 0.8 # Spill to remote when local load_ratio > 0.8
      seed_capacity_tokens_per_pod: 40000 # Per-pod capacity (renamed from seed_capacity_tokens)
      default_max_tokens: 4096 # Fallback when request omits max_tokens
      cache_ttl_seconds: 3600 # How long to remember cluster → context mapping
      ttft_budget_ms: 600 # TTFT above this → cluster is stressed
      itl_budget_ms: 40 # mean ITL above this → cluster is stressed
      ttft_alpha: 0.1 # EWMA factor for TTFT (slow — queue changes gradually)
      itl_alpha: 0.2 # EWMA factor for ITL  (faster — decode saturates quickly)
      capacity_alpha: 0.1 # capacity adaptation rate
  - model_id: Qwen/Qwen3.6-35B-A3B
    base_url: https://qwen36-35b-3b.ai.dev.paycomhq.com/v1
    api_key: ""
